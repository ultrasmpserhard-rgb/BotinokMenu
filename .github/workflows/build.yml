name: Build P1ratClient

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          bindings: ultrasmpserhard-rgb/bindings
          bindings-ref: fix-gamemanager

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: P1ratClient-Android64
          path: ${{ steps.build.outputs.build-output }}
