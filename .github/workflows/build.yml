name: Build BotinokMenu

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sdk: given
          target: Android64
          bindings-ref: 262722335fa38846bd3df71ea6cad2d615534b6e
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: BotinokMenu-Android64
          path: ${{ steps.build.outputs.build-output }}


